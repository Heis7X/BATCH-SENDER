services:
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  worker:
    build: .
    command: sh -c "python manage.py migrate && python manage.py run_email_worker"
    env_file: .env
    volumes:
      - .:/app
