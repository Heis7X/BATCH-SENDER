{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<a href="{% url 'signup' %}">Create account</a>
<div class="card narrow-card">
    <h1>Login</h1>
    <p>Use a Django user account. Staff users can manage templates in the admin interface and template screens.</p>
    <form method="post" class="stacked-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Login</button>
    </form>
</div>
{% endblock %}
